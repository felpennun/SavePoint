# Render Free hosts only the Django API. Vercel Hobby hosts Next.js and Neon
# Free hosts PostgreSQL; all three resources remain a blocking human action.
services:
  - type: web
    name: savepoint-api
    runtime: docker
    region: frankfurt
    plan: free
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    # Render tokenizes this override as argv; it does not evaluate shell
    # operators or parameter expansion. All control flow lives in-image.
    dockerCommand: sh /workspace/apps/api/render-start.sh
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        # Supply Neon's direct DATABASE_URL_UNPOOLED value here. The startup
        # chain performs migrations and session-scoped advisory locking.
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEPLOY_ENV
        value: production
      - key: DJANGO_ALLOWED_HOSTS
        # The real public API hostname, entered at first creation (repo-review
        # 2026-09-06 L-01). "localhost" was dead config and left host
        # validation entirely dependent on RENDER_EXTERNAL_HOSTNAME being set;
        # settings.py still appends that variable as belt-and-braces.
        sync: false
      - key: DJANGO_NUM_PROXIES
        # Number of proxy hops in front of Django (browser -> Vercel rewrite
        # -> Render -> app). Required for the per-IP rate throttles to key on
        # the real client instead of one upstream address (repo-review
        # 2026-09-06 M-02). Set to the actual chain length at creation.
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        # Render does not expose another service's public URL as a Blueprint
        # property. Enter the exact https:// web origin during first creation.
        sync: false
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
