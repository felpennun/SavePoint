# Render Free hosts only the Django API. Vercel Hobby hosts Next.js and Neon
# Free hosts PostgreSQL; all three resources remain a blocking human action.
services:
  - type: web
    name: savepoint-api
    runtime: docker
    region: frankfurt
    plan: free
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py import_catalogue &&
      python manage.py bootstrap_demo_account &&
      python manage.py seed_demo &&
      python manage.py runserver 0.0.0.0:${PORT:-10000}"
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEPLOY_ENV
        value: production
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        # Render does not expose another service's public URL as a Blueprint
        # property. Enter the exact https:// web origin during first creation.
        sync: false
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
