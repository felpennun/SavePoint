name: savepoint

services:
  db:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: savepoint_test
      POSTGRES_USER: savepoint_test
      POSTGRES_PASSWORD: local_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savepoint_test -d savepoint_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://savepoint_test:local_test_only@db:5432/savepoint_test
      DJANGO_SECRET_KEY: local-development-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,api"
      POSTGRES_DB: savepoint_test
      POSTGRES_USER: savepoint_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Local-development-only demo credentials, same spirit as
      # DJANGO_SECRET_KEY above -- not infrastructure secrets (D-02).
      # Override with real values via `docker compose run -e` for anything
      # beyond local dev.
      DEMO_USERNAME: demo-visitor
      DEMO_PASSWORD: SavePoint-Demo-2026-Visit!
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    # Local-development-only bind mounts (#dev-parity): the image built by
    # apps/api/Dockerfile only COPYs apps/api/ at build time, so without these
    # mounts every `docker compose run` sees whatever code existed at the last
    # build, not the current working tree -- makemigrations/pytest would
    # silently operate on stale source. This never affects the deployed image
    # itself (Render builds fresh from the same Dockerfile, no compose.yaml
    # involved); /workspace/.venv from the image layer is left un-mounted so
    # installed dependencies are unaffected.
    volumes:
      - ../apps/api:/workspace/apps/api
      - ../data:/workspace/data:ro
      - ../docs:/workspace/docs:ro

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side only (never NEXT_PUBLIC_*) -- same-origin proxy target for
      # the Next.js rewrite in next.config.ts, so the browser only ever talks
      # to `web`'s own origin and the Django session/CSRF cookies stay
      # same-origin (avoids needing CORS-with-credentials, per research A1).
      API_PROXY_TARGET: http://api:8000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    init: true
    ports:
      - "3000:3000"
    command: pnpm --dir apps/web dev --hostname 0.0.0.0 --port 3000
    volumes:
      - ../apps/web:/workspace/apps/web
      - /workspace/apps/web/node_modules
      - /workspace/apps/web/.next

volumes:
  postgres_data:
