name: savepoint

services:
  db:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # The default 64MB /dev/shm is too small for the aggregate evidence queries
    # the offline enrichment/import commands run over 190k+ governed works: a
    # large hash/sort spills to shared memory and PostgreSQL raises DiskFull.
    # 256MB clears the observed failure with headroom.
    shm_size: "256mb"
    environment:
      POSTGRES_DB: savepoint_test
      POSTGRES_USER: savepoint_test
      POSTGRES_PASSWORD: local_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savepoint_test -d savepoint_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://savepoint_test:local_test_only@db:5432/savepoint_test
      # 67 chars: long enough that Django's `check --deploy` W009 (predictable
      # SECRET_KEY) never fires -- still explicitly not a secret (D-02).
      DJANGO_SECRET_KEY: local-development-only-not-a-secret-please-set-a-real-one-in-deploy
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,api"
      DJANGO_DEPLOY_ENV: local
      # Requests arrive via the Next.js same-origin proxy (next.config.ts):
      # the browser's Origin header says "localhost:3000" (the page's real
      # origin), but the Host header Django actually sees is "api:8000" (the
      # proxy's HTTP client rewrites Host to match its destination) --
      # Django's CSRF Origin check compares Origin against its own
      # scheme+get_host() and rejects the mismatch (403) without this.
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      POSTGRES_DB: savepoint_test
      POSTGRES_USER: savepoint_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Offline enrichment credentials are optional and must be supplied via
      # an environment file or `docker compose run -e`; never commit values.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      # Local-development-only demo credentials, same spirit as
      # DJANGO_SECRET_KEY above -- not infrastructure secrets (D-02).
      # Override with real values via `docker compose run -e` for anything
      # beyond local dev.
      #
      # DEMO_ACCOUNTS (AUTH-02 / SC3) is the plural seed contract consumed by
      # `bootstrap_demo_accounts` in the startup chain below: a JSON array of
      # {key, username, password, label}. The `demo-anchor-primary` key is the
      # Phase 1 primary account (adopted in place, keeps the DemoAccountAnchor
      # that seed_demo needs); the other two are additional clearly-labelled
      # simulated accounts so a reviewer can sign in and out as several
      # distinct users. DEMO_USERNAME/DEMO_PASSWORD are kept for anyone still
      # invoking the singular `bootstrap_demo_account` by hand.
      DEMO_USERNAME: demo-visitor
      DEMO_PASSWORD: SavePoint-Demo-2026-Visit!
      DEMO_ACCOUNTS: >-
        [{"key":"demo-anchor-primary","username":"demo-visitor","password":"SavePoint-Demo-2026-Visit!","label":"Cuenta demo — visitante"},
         {"key":"demo-critic","username":"demo-critico","password":"SavePoint-Demo-2026-Critico!","label":"Cuenta demo — crítico"},
         {"key":"demo-collector","username":"demo-coleccionista","password":"SavePoint-Demo-2026-Coleccion!","label":"Cuenta demo — coleccionista"}]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    ports:
      - "8000:8000"
    # Fixed offline startup cycle (OPS-02/OPS-03): migrate, import the frozen
    # local catalogue snapshot, bootstrap/rotate the plural demo accounts from
    # DEMO_ACCOUNTS, load the deterministic seed interactions, then
    # materialise the home "Novedades" shelf (D-24: a frozen snapshot the
    # request path never recomputes) -- every command is idempotent and
    # advisory-lock-guarded (01-06/01.1-04/01-16/02-24), so re-running this
    # same chain on every `up` (including concurrent `docker compose up`
    # invocations) never duplicates rows or leaves partial state. Nothing
    # here downloads data or calls an external provider -- every input is
    # already a local file under data/.
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py import_catalogue &&
      python manage.py load_localized_summaries &&
      python manage.py bootstrap_demo_accounts &&
      python manage.py seed_demo &&
      python manage.py materialize_new_releases &&
      python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s
    # Local-development-only bind mounts (#dev-parity): the image built by
    # apps/api/Dockerfile only COPYs apps/api/ at build time, so without these
    # mounts every `docker compose run` sees whatever code existed at the last
    # build, not the current working tree -- makemigrations/pytest would
    # silently operate on stale source. This never affects the deployed image
    # itself (Render builds fresh from the same Dockerfile, no compose.yaml
    # involved); /workspace/.venv from the image layer is left un-mounted so
    # installed dependencies are unaffected.
    volumes:
      - ../apps/api:/workspace/apps/api
      - ../data:/workspace/data:ro
      - ../docs:/workspace/docs:ro
      - ../e2e:/workspace/e2e:ro

  recommendation-worker-signals:
    # content-signals-v1 (2026-09-11): computes the shared rating_term/
    # facet_similarity signals once per (user, revision, configuration) and
    # persists them to RecommendationSignalCache, so the 13 dependent workers
    # below (recommendations/published.py SIGNAL_DEPENDENT_ALGORITHM_IDS)
    # read them instead of each repeating the same O(candidates) loop in its
    # own container. _claim_next_job never lets a dependent job run before
    # this one has succeeded for the same job -- no dependent worker computes
    # this loop itself while this service is up.
    extends:
      service: api
    network_mode: "service:api"
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-signals-v1
    environment:
      SAVEPOINT_RECOMMENDATION_STATS_CACHE: "1"
    ports: !reset []
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  recommendation-worker-weighted:
    # PostgreSQL is both the durable queue and the recommendation snapshot
    # store for the local deployment. Redis remains an optional optimisation,
    # not a source of truth.
    extends:
      service: api
    network_mode: "service:api"
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-weighted-v1
    environment:
      # Corpus statistics are immutable per version; cache them in each
      # long-lived worker so every algorithm does not repeat the same scans.
      SAVEPOINT_RECOMMENDATION_STATS_CACHE: "1"
    ports: !reset []
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  recommendation-worker-multiplicative:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-multiplicative-v1

  recommendation-worker-twostage:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-twostage-v1

  recommendation-worker-negative:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-neg-v1

  recommendation-worker-recency:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id recency-v1

  recommendation-worker-tags:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id tag-taste-v1

  recommendation-worker-weighted-pop:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-weighted-pop-v1

  recommendation-worker-multiplicative-pop:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-multiplicative-pop-v1

  recommendation-worker-twostage-pop:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-twostage-pop-v1

  recommendation-worker-negative-pop:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-neg-pop-v1

  recommendation-worker-mmr:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-mmr-v1

  recommendation-worker-mmr-pop:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id content-cbf-mmr-pop-v1

  recommendation-worker-collaborative:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id cf-user-knn-v1

  recommendation-worker-hybrid:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id hybrid-weighted-cf-v1

  recommendation-worker-hybrid-mmr:
    extends:
      service: recommendation-worker-weighted
    command: python manage.py process_recommendation_jobs --loop --poll-seconds 2 --algorithm-id hybrid-mmr-v1

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side only (never NEXT_PUBLIC_*) -- same-origin proxy target for
      # the Next.js rewrite in next.config.ts, so the browser only ever talks
      # to `web`'s own origin and the Django session/CSRF cookies stay
      # same-origin (avoids needing CORS-with-credentials, per research A1).
      API_PROXY_TARGET: http://api:8000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    ports:
      - "3000:3000"
    # Production build+start, not `next dev`: dev mode's HMR WebSocket
    # reproducibly failed the handshake in this environment
    # (ERR_INVALID_HTTP_RESPONSE), which silently prevented React from
    # finishing hydration -- the login form's onSubmit handler never
    # attached, so a click fell through to the browser's native GET submit,
    # putting the password in the URL query string. Also matches the
    # project's own reproducibility principle (research A-note: "el mismo
    # commit y lockfiles construye local y Render"). Live-reload for active
    # development: run `pnpm --dir apps/web dev` directly on the host, or
    # `docker compose run --rm -p 3000:3000 web pnpm --dir apps/web dev`.
    command: sh -c "pnpm --dir apps/web exec next build && pnpm --dir apps/web exec next start --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/es', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 60s
    volumes:
      - ../apps/web:/workspace/apps/web
      - /workspace/apps/web/node_modules
      - /workspace/apps/web/.next

volumes:
  postgres_data:
