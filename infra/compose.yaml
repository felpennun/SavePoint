name: savepoint

services:
  db:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: savepoint_test
      POSTGRES_USER: savepoint_test
      POSTGRES_PASSWORD: local_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savepoint_test -d savepoint_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      POSTGRES_DB: savepoint_test
      POSTGRES_USER: savepoint_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  postgres_data:

