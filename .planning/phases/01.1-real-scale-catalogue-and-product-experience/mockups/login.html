<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavePoint — Log in (mockup)</title>
<style>
  :root{
    --surface-base:#0d0d12; --surface-raised:#17171f; --surface-overlay:#1f1f2b; --surface-border:#2c2c3a;
    --text-primary:#f2f2f5; --text-secondary:#b8b8c4; --text-muted:#8a8a99;
    --accent:#8b7cf6; --accent-strong:#a394ff; --accent-on:#16121f; --focus-ring:#ffd166;
    --radius-card:.75rem; --radius-control:.5rem;
    --text-meta:.8125rem; --text-body:1rem; --text-heading:1.25rem; --text-display:1.75rem;
  }
  [data-theme=light]{
    --surface-base:#f4f4f7; --surface-raised:#ffffff; --surface-overlay:#ececf1; --surface-border:#d9d9e0;
    --text-primary:#1b1b22; --text-secondary:#4a4a57; --text-muted:#6c6c7a;
    --accent:#6d5cd6; --accent-strong:#5a49c0; --accent-on:#ffffff; --focus-ring:#8a5a00;
  }
  html{color-scheme:dark} html[data-theme=light]{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-base);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  a{color:var(--accent-strong)}
  .note{background:#2a2340;color:#d8d0ff;font-size:var(--text-meta);padding:8px 16px;text-align:center}
  header.appbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 24px;background:var(--surface-raised);border-bottom:1px solid var(--surface-border)}
  .brand{font-weight:600}
  .navgroup{display:flex;align-items:center;gap:16px}
  nav.main a{color:var(--text-secondary);text-decoration:none;margin-left:24px}
  .theme-toggle{min-height:2.75rem;display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-overlay);color:var(--text-secondary);border:1px solid var(--surface-border);
    border-radius:var(--radius-control);padding:0 12px;font-size:var(--text-meta);font-weight:600;cursor:pointer}
  .theme-toggle:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  main{max-width:420px;margin:0 auto;padding:48px 24px 64px}
  h1{font-size:var(--text-display);font-weight:600;line-height:1.2;margin:0 0 8px}
  p.intro{color:var(--text-secondary);margin:0 0 24px}
  form{background:var(--surface-raised);border:1px solid var(--surface-border);
    border-radius:var(--radius-card);padding:24px;display:flex;flex-direction:column;gap:16px}
  label{font-size:var(--text-meta);font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px}
  input{width:100%;min-height:2.75rem;background:var(--surface-overlay);color:var(--text-primary);
    border:1px solid var(--surface-border);border-radius:var(--radius-control);padding:0 12px;font-size:var(--text-body)}
  input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  .btn-primary{min-height:2.75rem;background:var(--accent);color:var(--accent-on);font-weight:600;
    border:0;border-radius:var(--radius-control);padding:0 20px;font-size:var(--text-body);cursor:pointer}
  .btn-primary:hover{background:var(--accent-strong)}
  .altline{font-size:var(--text-meta);color:var(--text-secondary);margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="note">Non-binding sketch derived from <code>01.1-UI-SPEC.md</code> — the dedicated full login page the navbar person-icon links to.</div>
<header class="appbar">
  <span class="brand">SavePoint</span>
  <div class="navgroup">
    <nav class="main"><a href="home.html">Home</a><a href="catalogue.html">Catalogue</a></nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false"
      aria-label="Switch to light theme" onclick="toggleTheme()">
      <span aria-hidden="true">◐</span> <span id="themeWord">Dark</span>
    </button>
  </div>
</header>
<main>
  <h1>Log in</h1>
  <p class="intro">Sign in to a simulated demo account.</p>
  <form onsubmit="event.preventDefault()">
    <div>
      <label for="identifier">Email or username</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn-primary" type="submit">Log in</button>
  </form>
  <p class="altline">No account yet? <a href="#">Create a simulated account</a></p>
</main>
<script>
  function toggleTheme(){
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    var next = isLight ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    var btn = document.getElementById('themeToggle');
    btn.setAttribute('aria-pressed', String(next === 'light'));
    btn.setAttribute('aria-label', next === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
    document.getElementById('themeWord').textContent = next === 'light' ? 'Light' : 'Dark';
    try{ document.cookie = 'sp-theme=' + next + ';path=/;max-age=31536000;SameSite=Lax'; }catch(e){}
  }
  (function(){
    var m = document.cookie.match(/(?:^|; )sp-theme=(light|dark)/);
    if(m && m[1] === 'light'){ document.documentElement.setAttribute('data-theme','light');
      var b=document.getElementById('themeToggle'); b.setAttribute('aria-pressed','true');
      b.setAttribute('aria-label','Switch to dark theme'); document.getElementById('themeWord').textContent='Light'; }
  })();
</script>
</body>
</html>
